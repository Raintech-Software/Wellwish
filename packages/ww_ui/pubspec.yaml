name: ww_ui
description: "WellWish design system: tokens, theme and shared widgets."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/

  # Poppins (OFL, fonts/OFL.txt) for English and Hindi. Poppins has no Odia letters: Noto Sans
  # Oriya (and Noto Sans Devanagari for any Hindi letter Poppins lacks) are bundled as the
  # fallback, so every phone shows the same letters (OFL, fonts/OFL-NotoSans*.txt; Phase 9).
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
    - family: NotoSansOriya
      fonts:
        - asset: fonts/NotoSansOriya-Regular.ttf
        - asset: fonts/NotoSansOriya-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: fonts/NotoSansDevanagari-Regular.ttf
        - asset: fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
