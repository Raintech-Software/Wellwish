# App icon from the official logo. Regenerate after changing the logo:
#   dart pub global run flutter_launcher_icons -f flutter_launcher_icons.yaml
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../packages/ww_ui/assets/branding/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "../../packages/ww_ui/assets/branding/app_icon_foreground.png"
