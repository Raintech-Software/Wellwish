[project]
name = "wellwish-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "S", "RUF"]
ignore = [
    "RUF012",  # Django class attributes (Meta, admin options) are fine as plain lists
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "DJ008"]  # asserts, fake secrets, throwaway models
"conftest.py" = ["S101"]
"config/settings/*" = ["F405"]
"apps/*/seed.py" = ["E501", "RUF001"]  # data tables with Hindi and Odia names

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ['/migrations/']

[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "celery.*", "kombu.*", "channels.*", "channels_redis.*", "django_celery_beat.*",
    "environ.*", "factory.*", "pyotp.*", "storages.*", "google.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# --ds wins over the DJANGO_SETTINGS_MODULE env var set in the container (.env says dev)
addopts = "-q --strict-markers --ds=config.settings.test"
filterwarnings = ["ignore::DeprecationWarning:celery.*"]
